# Builds the site from src/ and the trail folder and publishes it to GitHub
# Pages. Needs, once, in the repository's settings: Pages → Source: GitHub
# Actions. With several folders under trails/, set the repository variable
# WAYMARKED_TRAIL to the one to publish.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          WAYMARKED_TRAIL: ${{ vars.WAYMARKED_TRAIL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub's processing of the upload has taken from seconds to over
          # the default 10 minutes; a slow queue should mean a longer wait,
          # not a failed run.
          timeout: 1800000
